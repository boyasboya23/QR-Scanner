<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Attendance Scanner</title>
  <script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
    #reader { width: 100%; max-width: 400px; margin: auto; }
    #status { margin-top: 20px; font-size: 18px; font-weight: bold; }
    button { margin: 10px; padding: 10px 20px; }
  </style>
</head>
<body>
  <h1>QR Attendance Scanner</h1>
  <div id="reader"></div>
  <p id="status">Waiting for scan...</p>
  <button onclick="startScanner()">Start Camera</button>
  <button onclick="stopScanner()">Stop Camera</button>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyRmzFqJfbOalXXYhoxX131s9eFDTTktnJKFFijHT-6roJ3Kq2nbmA0syjyZ6o_6b5BWQ/exec";
    let html5QrCode;

    function markAttendance(decodedText) {
      const url = SCRIPT_URL + "?id=" + encodeURIComponent(decodedText);

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            document.getElementById("status").innerText =
              `${data.name} (${data.id}) marked Present`;
          } else {
            document.getElementById("status").innerText = data.message;
          }
        })
        .catch(err => {
          document.getElementById("status").innerText = "Error: " + err;
        });
    }

    async function startScanner() {
      html5QrCode = new Html5Qrcode("reader");

      try {
        // Get all available cameras
        const devices = await Html5Qrcode.getCameras();
        if (devices && devices.length) {
          // Try to pick the back camera (usually the last one)
          const backCamera = devices.find(d => d.label.toLowerCase().includes("back")) || devices[devices.length - 1];

          await html5QrCode.start(
            backCamera.id,
            { fps: 5, qrbox: { width: 200, height: 200 } },
            (decodedText, decodedResult) => {
              markAttendance(decodedText);
            }
          );
        } else {
          document.getElementById("status").innerText = "No cameras found.";
        }
      } catch (err) {
        document.getElementById("status").innerText = "Camera error: " + err;
      }
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          document.getElementById("status").innerText = "Camera stopped.";
        }).catch(err => {
          document.getElementById("status").innerText = "Stop error: " + err;
        });
      }
    }
  </script>
</body>
</html>
