<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QR Scanner Attendance</title>
</head>
<body>
  <h1>QR Scanner</h1>
  <p id="status">Waiting for scan...</p>

  <!-- Example button to simulate a scan -->
  <button onclick="sendID('ID-001')">Simulate Scan ID-001</button>
  <button onclick="sendID('ID-004')">Simulate Scan ID-004</button>

  <script>
    function sendID(decodedText) {
      fetch("https://script.google.com/macros/s/AKfycbyRmzFqJfbOalXXYhoxX131s9eFDTTktnJKFFijHT-6roJ3Kq2nbmA0syjyZ6o_6b5BWQ/exec", {
        method: "POST",
        body: JSON.stringify({ id: decodedText }),
        headers: { "Content-Type": "application/json" }
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          document.getElementById("status").innerText =
            `${data.name} (${data.id}) marked Present`;
        } else {
          document.getElementById("status").innerText = data.message;
        }
      })
      .catch(err => {
        document.getElementById("status").innerText = "Error: " + err;
      });
    }
  </script>
</body>
</html>
