<!DOCTYPE html>
<html>
<head>
  <title>QR Attendance Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <h2>Scan QR Code</h2>
  <div id="reader" style="width:300px"></div>
  <p id="status"></p>

  <script>
    function onScanSuccess(decodedText, decodedResult) {
      document.getElementById("status").innerText = "Scanned: " + decodedText;

      // Send scanned ID to Google Apps Script Web App
      fetch("https://script.google.com/macros/s/AKfycbyRmzFqJfbOalXXYhoxX131s9eFDTTktnJKFFijHT-6roJ3Kq2nbmA0syjyZ6o_6b5BWQ/exec", {
        method: "POST",
        body: JSON.stringify({ id: decodedText }),
        headers: { "Content-Type": "application/json" }
      })
      .then(res => res.text())
      .then(msg => {
        document.getElementById("status").innerText = msg;
      })
      .catch(err => {
        document.getElementById("status").innerText = "Error: " + err;
      });
    }

    let html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
